<text x="1496" y="1242" text-anchor="middle" class="actor"><tspan x="1496" dy="0">Administrator</tspan></text>
<text x="800" y="1406" text-anchor="middle" class="sub">Solid lines represent actor participation; they do not represent workflow order.</text>
<text x="52" y="1472" dy="0" class="note">Account holder represents Student, Faculty, Dean, Coordinator and Administrator accounts.</text>
<text x="52" y="1472" dy="27" class="note">All roles can use the public repository; shared account actions apply to all account holders.</text>
<text x="52" y="1472" dy="54" class="note">Member full-document access requires an active, approved account, current policy acceptance and active semester enrollment.</text>
<text x="52" y="1472" dy="81" class="note">Dean and Coordinator actions are restricted to their department and assigned journal tasks.</text>
<text x="52" y="1472" dy="108" class="note">Journals become read-only after submission. Submit, forward and publish require complete journal details and every PDF.</text>
<text x="52" y="1472" dy="135" class="note">Current flow has no separate Dean approval or return step. Student and Faculty direct submission is disabled.</text>
</svg>
